[project]
name = "mc7"
version = "0.1.0"
description = "Communication layer and MC7 assembler toolchain for Siemens S7-300 PLCs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-snap7>=3.5,<4"]

[project.scripts]
mc7 = "mc7.cli:main"
mc7asm = "mc7asm.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc7", "src/mc7asm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: talks to a real PLC, enabled with --plc-host",
    "plc_write: modifies the real PLC, additionally needs --plc-allow-writes",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
